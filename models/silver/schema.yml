# models/silver/schema.yml
version: 2
models:
  - name: silver_order_lines
    description: Lineas enriquecidas con net_revenue (precio con descuento).
    columns:
      - name: order_id
        tests: [not_null]
      - name: net_revenue
        tests: [not_null]
  - name: silver_orders_enriched
    description: Un pedido por fila, con cliente, pais y net_revenue agregado.
    columns:
      - name: order_id
        description: Clave primaria del pedido.
        tests: [unique, not_null]
      - name: net_revenue
        tests: [not_null]
      - name: order_status
        tests:
          - accepted_values:
              arguments: 
                values: ['F', 'O', 'P']